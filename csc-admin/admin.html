<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B3A8B">
<title>Admin | Christian Service Church</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B3A8B; --navy-d:#0F1F4D; --navy-m:#2a4fb3;
  --gold:#C9A227; --gold-s:#fbf3d3;
  --bg:#F1F3F9; --card:#fff; --ink:#151b33; --mute:#5f6783; --line:#dfe3ee;
  --ok:#17794f; --ok-s:#dff3e8; --warn:#8a5a00; --warn-s:#fdefc9; --bad:#b3261e; --bad-s:#fbe3e0; --info:#1B3A8B; --info-s:#e4eafb;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.2}
h1{font-size:clamp(26px,4vw,34px)}
h2{font-size:22px}
h3{font-size:18px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--navy)}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
body:has(dialog[open]){overflow:hidden}

/* ---------- controls ---------- */
input[type=text],input[type=email],input[type=password],input[type=url],input[type=date],input[type=time],input[type=search],select,textarea{
  width:100%;min-height:44px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:16px}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:0;border-color:var(--navy)}
label.l{display:block;font-weight:600;margin:0 0 6px;font-size:14px}
label.l i{color:var(--bad);font-style:normal}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{background:#f6f8fd;border-color:#c8cfe3}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-d)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}
.icon{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;flex:none}
.icon:hover{background:rgba(27,58,139,.09)}
.icon.bad:hover{background:var(--bad-s);color:var(--bad)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;position:relative;min-height:44px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch span{width:44px;height:26px;border-radius:99px;background:#c5cbdc;position:relative;transition:background .2s;flex:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--navy);outline-offset:2px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-s);color:var(--ok)}
.pill.draft{background:#e8eaf1;color:var(--mute)}
.pill.warn{background:var(--warn-s);color:var(--warn)}
.pill.info{background:var(--info-s);color:var(--info)}

/* ---------- login ---------- */
#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;
  background:radial-gradient(900px 420px at 85% -5%,rgba(201,162,39,.28),transparent 60%),linear-gradient(165deg,var(--navy),var(--navy-d))}
.lcard{width:min(410px,100%);background:#fff;border-radius:20px;padding:34px 28px 28px;box-shadow:0 30px 80px rgba(6,14,45,.45)}
.mark{width:54px;height:54px;border-radius:16px;background:var(--navy-d);color:var(--gold);display:grid;place-items:center;margin:0 auto 16px}
.lcard h1{font-size:26px;text-align:center}
.lcard .sub{text-align:center;color:var(--mute);margin:6px 0 24px}
.lcard .fld{margin-bottom:14px}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin:2px 0 10px}
.note{background:var(--gold-s);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:16px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-d) 100%);color:#fff;padding:22px 14px 16px;position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 22px}
.brand .mark{width:46px;height:46px;border-radius:14px;margin:0;padding:5px;background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.28);box-shadow:0 8px 24px rgba(0,0,0,.18),0 0 0 3px rgba(201,162,39,.14);display:grid;place-items:center;overflow:hidden}
.brand .mark img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.brand b{display:block;font-family:"Source Serif 4",Georgia,serif;font-size:18px;line-height:1.15}
.brand small{color:rgba(255,255,255,.65);font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.84);text-decoration:none;font-weight:500;min-height:44px}
.nav a:hover{background:rgba(255,255,255,.09)}
.nav a.on{background:rgba(255,255,255,.15);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav a[data-r=setup]{margin-top:14px}
.badge{margin-left:auto;font-style:normal;font-size:12px;font-weight:600;background:rgba(255,255,255,.16);padding:1px 9px;border-radius:99px}
.badge:empty{display:none}
.sfoot{margin-top:auto;padding:16px 8px 0;display:grid;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.8)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.chip.live::before{background:#4fd18b}
.out{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:9px 12px;min-height:44px;font-weight:500}
.out:hover{background:rgba(255,255,255,.1)}
.top{display:none}
.scrim{display:none}
.main{padding:32px clamp(16px,4vw,48px) 90px;max-width:1080px;width:100%}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph p{color:var(--mute);margin-top:6px;max-width:56ch}
.loading{color:var(--mute);padding:30px 0}

/* ---------- lists ---------- */
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1 1 240px;max-width:380px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.search input{padding-left:40px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;min-height:36px;font-weight:600;font-size:14px;color:var(--mute)}
.fchip:hover{border-color:#b9c2dd}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.thumb{width:56px;height:56px;border-radius:8px;background:var(--info-s);color:var(--navy);display:grid;place-items:center;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0;flex:1}
.info .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info .m{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:13.5px}
.info .x{color:var(--mute);font-size:14px;display:-webkit-box;line-clamp:1;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.acts{display:flex;align-items:center;gap:2px;flex:none}
.empty{text-align:center;padding:52px 20px;background:var(--card);border:1px dashed #b9c2dd;border-radius:14px}
.empty svg{color:var(--navy);opacity:.7}
.empty h3{margin:10px 0 4px}
.empty p{color:var(--mute);margin-bottom:16px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.gi{position:relative;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.gi img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.gi .cap{padding:9px 12px 11px}
.gi .cap b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi .cap span{color:var(--mute);font-size:13px}
.gi .acts{position:absolute;top:8px;right:8px;gap:6px}
.gi .icon{width:36px;height:36px;background:rgba(255,255,255,.94);border:1px solid var(--line)}
.gi .tag{position:absolute;top:10px;left:10px}

/* ---------- dashboard ---------- */
.ledger{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:30px}
.lrow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .ic{width:42px;height:42px;border-radius:12px;background:var(--info-s);color:var(--navy);display:grid;place-items:center;flex:none}
.lrow>div:nth-child(2){min-width:0}
.lrow a.nm{font-weight:700;text-decoration:none;color:var(--ink)}
.lrow a.nm:hover{color:var(--navy)}
.lrow small{display:block;color:var(--mute);font-size:13.5px}
.lrow .num{margin-left:auto;text-align:right;font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:26px;line-height:1;padding-right:6px}
.lrow .num small{font-family:Figtree,sans-serif;font-weight:500;margin-top:4px}
.sec{margin:0 0 12px}
.recent .row{align-items:flex-start}
.recent .thumb{width:40px;height:40px;border-radius:10px}
.recent .when{color:var(--mute);font-size:13.5px;flex:none}

/* ---------- setup ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card h3{margin-bottom:8px}
.cardh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.card p{color:var(--mute)}
.steps{margin:8px 0 0;padding-left:20px;display:grid;gap:8px}
code{background:#eef1f9;padding:1px 6px;border-radius:5px;font-size:.92em}
pre{margin:10px 0 0;background:var(--navy-d);color:#e6ebff;padding:14px 16px;border-radius:10px;overflow:auto;font-size:13px;line-height:1.55;-webkit-overflow-scrolling:touch}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* ---------- dialogs ---------- */
dialog{border:0;padding:0;border-radius:18px;width:min(660px,calc(100% - 24px));max-height:calc(100dvh - 32px);box-shadow:0 30px 80px rgba(10,20,60,.4);color:var(--ink);background:#fff}
dialog::backdrop{background:rgba(10,20,60,.5)}
dialog[open]{display:flex;flex-direction:column}
dialog form{display:flex;flex-direction:column;min-height:0;flex:1}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 14px 22px;border-bottom:1px solid var(--line)}
.db{overflow:auto;padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.fld{grid-column:1/-1}
.fld.half{grid-column:span 1}
.df{display:flex;align-items:center;gap:10px;padding:14px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap}
.df .sp{flex:1}
.df .err{flex-basis:100%;margin:0;min-height:0}
.db1{padding:24px 24px 8px}
.db1 p{color:var(--mute);margin-top:8px}
.prevs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pv{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.pv img{width:100%;height:100%;object-fit:cover;display:block}
.pv button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(15,31,77,.85);color:#fff;display:grid;place-items:center;padding:0}
.upl{position:relative}
.hint{color:var(--mute);font-size:13.5px;margin-top:6px}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));display:grid;gap:8px;z-index:100;width:min(92vw,380px);pointer-events:none}
.toast{background:var(--navy-d);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:600}
.toast.bad{background:var(--bad)}

/* ---------- mobile ---------- */
@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .22s ease;z-index:50}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(10,20,60,.5);z-index:45}
  .top{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top))}
  .top .icon{color:#fff}
  .top .icon:hover{background:rgba(255,255,255,.12)}
  .top b{font-family:"Source Serif 4",Georgia,serif;font-size:18px}
  .main{padding-top:22px}
}
@media(max-width:560px){
  .fld.half{grid-column:1/-1}
  dialog{margin:auto auto 0;width:100%;max-width:100%;border-radius:18px 18px 0 0;max-height:94dvh}
  .db{padding:16px 18px}
  .dh{padding-left:18px}
  .df{padding-left:18px;padding-right:18px}
  .df .btn{flex:1}
  .row{gap:10px;padding:10px 10px}
  .row .pill{display:none}
  .thumb{width:48px;height:48px}
  .lrow{padding:12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* Supabase columns are snake_case (videoUrl is video_url). Convert both ways. */
const snake = s => s.replace(/[A-Z]/g, c => '_' + c.toLowerCase());
const dbTable = key => COLLECTIONS[key]?.table || key;
const blocked = ex => !!ex && (ex.code === '42501' || ex.status === 403 || String(ex.statusCode) === '403' || /row-level security|not authorized|permission denied/i.test(ex.message || ''));
function toRow(key, it) {
  const col = COLLECTIONS[key];
  const r = { id: it.id };
  if (it.createdAt) r.created_at = it.createdAt;
  r.updated_at = it.updatedAt || null;
  col.fields.forEach(f => {
    if (key === 'announcements' && f.name === 'sendPush') return;
    const v = it[f.name];
    r[snake(f.name)] = (f.type === 'date' || f.type === 'time') ? (v || null) : f.type === 'checkbox' ? !!v : (v ?? '');
  });
  if (!col.noPublish) r.published = !!it.published;
  return r;
}
function fromRow(key, row) {
  const col = COLLECTIONS[key];
  const it = { id: row.id, createdAt: row.created_at || '', updatedAt: row.updated_at || '' };
  col.fields.forEach(f => {
    if (key === 'announcements' && f.name === 'sendPush') {
      it[f.name] = row.send_push ?? true;
      return;
    }
    let v = row[snake(f.name)];
    if (v == null) v = f.type === 'checkbox' ? false : '';
    if (f.type === 'time' && v) v = String(v).slice(0, 5);
    it[f.name] = v;
  });
  if (!col.noPublish) it.published = !!row.published;
  return it;
}
const MEDIA = '/storage/v1/object/public/media/';
const sessionExpired = ex => !!ex && (/jwt expired|token is expired|refresh token/i.test(ex.message || '') || ex.code === 'PGRST301' || ex.status === 401);
const Store = {
  mode: 'demo', sb: null, notice: '',
  async init() {
    if (!(typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL && typeof SUPABASE_ANON_KEY !== 'undefined' && SUPABASE_ANON_KEY)) return;
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    this.mode = 'supabase';
  },
  async list(col) {
    if (this.mode === 'supabase') {
      const { data, error } = await this.sb.from(dbTable(col)).select('*');
      if (error) throw error;
      return data.map(r => fromRow(col, r));
    }
    const raw = lsGet(LS + col);
    if (raw === null) { const s = seed()[col] || []; lsSet(LS + col, JSON.stringify(s)); return s; }
    try { return JSON.parse(raw) || []; } catch (e) { return []; }
  },
  async ensureSession() {
    if (this.mode !== 'supabase') return;
    const current = await this.sb.auth.getSession();
    if (current.error) throw current.error;
    if (!current.data.session) { const e = new Error('Your admin session has expired. Sign in again.'); e.code = 'AUTH_EXPIRED'; throw e; }
    const expiresAt = Number(current.data.session.expires_at || 0);
    if (expiresAt && expiresAt < Math.floor(Date.now() / 1000) + 60) {
      const refreshed = await this.sb.auth.refreshSession();
      if (refreshed.error || !refreshed.data.session) { const e = refreshed.error || new Error('Your admin session has expired. Sign in again.'); e.code = 'AUTH_EXPIRED'; throw e; }
    }
  },
  async notifyAnnouncement(id) {
    if (this.mode !== 'supabase' || !id) return;
    await this.ensureSession();
    const { error } = await this.sb.functions.invoke('send-announcement-notification', { body: { announcement_id: id } });
    if (error) throw error;
  },
  async save(col, item) {
    if (this.mode === 'supabase') {
      await this.ensureSession();
      const { error } = await this.sb.from(dbTable(col)).upsert(toRow(col, item));
      if (error) throw error;
      return;
    }
    const list = await this.list(col);
    const i = list.findIndex(x => x.id === item.id);
    if (i >= 0) list[i] = item; else list.push(item);
    if (!lsSet(LS + col, JSON.stringify(list))) throw new Error('This browser has no room left for demo data. Remove some photos, or connect Supabase.');
  },
  async remove(col, id) {
    if (this.mode === 'supabase') {
      await this.ensureSession();
      const { data, error } = await this.sb.from(dbTable(col)).delete().eq('id', id).select('id');
      if (error) throw error;
      if (!data || !data.length) { const e = new Error('Not allowed'); e.code = '42501'; throw e; }
      return;
    }
    const list = (await this.list(col)).filter(x => x.id !== id);
    lsSet(LS + col, JSON.stringify(list));
  },
  /* photos go to a public Supabase Storage bucket called "media"; demo mode keeps them inline */
  async uploadImage(dataUrl) {
    await this.ensureSession();
    const blob = await (await fetch(dataUrl)).blob();
    const extension = blob.type.startsWith('video/') ? (blob.type.split('/')[1] || 'mp4') : 'jpg';
    const path = new Date().getFullYear() + '/' + uid() + '.' + extension;
    const { error } = await this.sb.storage.from('media').upload(path, blob, { contentType: blob.type || 'application/octet-stream', cacheControl: '31536000', upsert: false });
    if (error) throw error;
    return this.sb.storage.from('media').getPublicUrl(path).data.publicUrl;
  },
  async removeFile(url) {
    if (this.mode !== 'supabase' || !url || !String(url).includes(MEDIA)) return;
    try { await this.sb.storage.from('media').remove([decodeURIComponent(String(url).split(MEDIA)[1].split('?')[0])]); } catch (e) {}
  }
};

function authError(e) {
  const m = ((e && e.message) || '').toLowerCase(), c = (e && e.code) || '';
  if (c === 'invalid_credentials' || m.includes('invalid login') || m.includes('invalid email') || m.includes('invalid password') || (e && e.status === 400)) return 'That email or password is not correct. Confirm the user email is exactly edstudios77@gmail.com.';
  if (m.includes('not confirmed') || m.includes('email not confirmed')) return 'Confirm this user in Supabase Authentication, then try again.';
  if (e && (e.status === 429 || m.includes('rate limit'))) return 'Too many attempts. Wait a few minutes and try again.';
  if (m.includes('fetch') || m.includes('network') || m.includes('load https://cdn')) return 'The admin page cannot reach Supabase. Open it through your website or a local web server, not directly as a file.';
  if (m.includes('jwt') || m.includes('expired') || c === 'AUTH_EXPIRED') return 'Your admin session expired. Sign in again to continue.';
  if (m.includes('api key')) return 'The Supabase URL or anon key is invalid. Check the project API settings.';
  return 'Could not sign in: ' + ((e && e.message) || 'check the Supabase project and try again.');
}

async function viewAnalytics(main) {
  const defaultRange = 'last_30_days';
  const statusMap = {
    connected: { cls: 'ok', label: 'Connected' },
    configuration_required: { cls: 'warn', label: 'Configuration Required' },
    unauthorized: { cls: 'warn', label: 'Unauthorized' },
    google_api_error: { cls: 'bad', label: 'Connection Error' },
    loading: { cls: 'info', label: 'Loading' }
  };

  function metricCard(label, value, meta) {
    return `<div class="card"><p class="muted" style="margin-bottom:8px">${esc(label)}</p><h3 style="font-size:clamp(26px,4vw,34px)">${esc(value)}</h3><p class="muted" style="margin-top:8px">${esc(meta || '')}</p></div>`;
  }

  async function loadAnalytics(range = defaultRange) {
    if (!Store.sb || !Store.sb.auth) {
      return { status: 'configuration_required', message: 'Google Analytics is not connected yet. Add the required GA4 credentials to the server environment.' };
    }
    try {
      const { data: sessionData } = await Store.sb.auth.getSession();
      const token = sessionData?.session?.access_token;
      if (!token) {
        return { status: 'unauthorized', message: 'Admin authentication is required to view analytics.' };
      }

      const { data, error } = await Store.sb.functions.invoke('google-analytics-report', {
        body: { range },
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      if (error) {
        const detail = error?.message || 'Edge Function returned a non-2xx status code.';
        throw new Error(detail);
      }

      return data || { status: 'configuration_required', message: 'Google Analytics is not connected yet. Add the required GA4 credentials to the server environment.' };
    } catch (err) {
      const message = err?.message || 'Google Analytics could not be reached.';
      return { status: 'google_api_error', message, rawError: message };
    }
  }

  main.innerHTML = `
    <header class="ph"><div><h1>Analytics</h1><p>Website traffic, engagement and visitor activity pulled from Google Analytics 4.</p></div><div class="btnrow"><button class="btn sm" type="button" data-act="ga-refresh">Refresh</button></div></header>
    <div id="analytics-body" class="loading">Loading analytics…</div>
  `;

  const render = async (range = defaultRange) => {
    const body = $('#analytics-body');
    if (!body || route !== 'analytics') return;
    body.className = '';
    body.innerHTML = `
      <div class="card">
        <div class="cardh">
          <div>
            <h3>Google Analytics</h3>
            <p class="muted">Status: <span class="pill warn">Loading</span></p>
          </div>
          <div class="chips">
            ${['today', 'yesterday', 'last_7_days', 'last_30_days', 'last_90_days'].map((option) => `<button class="fchip ${option === range ? 'on' : ''}" type="button" data-act="ga-range" data-range="${option}">${option.replace(/_/g, ' ').replace(/(^\w|\s\w)/g, (m) => m.toUpperCase())}</button>`).join('')}
          </div>
        </div>
        <p class="muted">Loading analytics…</p>
      </div>
    `;
    const report = await loadAnalytics(range);
    if (!body || route !== 'analytics') return;
    const status = statusMap[report.status] || statusMap.configuration_required;
    const summary = report.summary || {};
    const errorText = report.rawError ? `${report.message || 'Google Analytics error.'} Details: ${report.rawError}` : (report.message || (report.status === 'connected' ? 'Google Analytics is connected and ready.' : 'No analytics data available for this period.'));
    const topCards = `
      <div class="card">
        <div class="cardh">
          <div>
            <h3>Google Analytics</h3>
            <p class="muted">Status: <span class="pill ${status.cls}">${status.label}</span></p>
          </div>
          <div class="chips">
            ${['today', 'yesterday', 'last_7_days', 'last_30_days', 'last_90_days'].map((option) => `<button class="fchip ${option === range ? 'on' : ''}" type="button" data-act="ga-range" data-range="${option}">${option.replace(/_/g, ' ').replace(/(^\w|\s\w)/g, (m) => m.toUpperCase())}</button>`).join('')}
          </div>
        </div>
        <p class="muted">Property: ${esc(report.propertyId || 'Not configured')} • Last updated: ${esc(report.lastUpdated ? new Date(report.lastUpdated).toLocaleString() : '—')}</p>
        <p style="margin-top:12px; color:${report.status === 'connected' ? 'var(--ok)' : 'var(--bad)'}; font-weight:600">${esc(errorText)}</p>
      </div>
      <div class="secure-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:16px 0;">
        ${metricCard('Total Users', report.status === 'connected' ? (summary.totalUsers ?? 0).toLocaleString() : 'No data available', report.status === 'connected' ? 'Users across the selected period' : 'No data available')}
        ${metricCard('Active Users', report.status === 'connected' ? (summary.activeUsers ?? 0).toLocaleString() : 'No data available', report.status === 'connected' ? 'Users active in the date range' : 'No data available')}
        ${metricCard('New Users', report.status === 'connected' ? (summary.newUsers ?? 0).toLocaleString() : 'No data available', report.status === 'connected' ? 'New visitor users' : 'No data available')}
        ${metricCard('Sessions', report.status === 'connected' ? (summary.sessions ?? 0).toLocaleString() : 'No data available', report.status === 'connected' ? 'Recorded sessions' : 'No data available')}
        ${metricCard('Page Views', report.status === 'connected' ? (summary.pageViews ?? 0).toLocaleString() : 'No data available', report.status === 'connected' ? 'Total page views' : 'No data available')}
        ${metricCard('Engagement Time', report.status === 'connected' ? `${Number(summary.engagementRate || 0).toFixed(1)}%` : 'No data available', report.status === 'connected' ? 'Average engagement rate' : 'No data available')}
      </div>
    `;
    body.innerHTML = topCards;
  };

  await render(defaultRange);

  document.addEventListener('click', async (event) => {
    const btn = event.target.closest('[data-act="ga-range"]');
    if (btn && route === 'analytics') {
      await render(btn.dataset.range || defaultRange);
    }
    const refresh = event.target.closest('[data-act="ga-refresh"]');
    if (refresh && route === 'analytics') {
      await render(defaultRange);
    }
  }, { once: false });
}

  switch (f.type) {
    case 'textarea': return `<div class="${cls}">${lab}<textarea id="${id}" name="${f.name}" rows="${f.rows || 5}" ${req}>${esc(v)}</textarea></div>`;
    case 'select': return `<div class="${cls}">${lab}<select id="${id}" name="${f.name}">${f.options.map(o => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
    case 'checkbox': return `<div class="${cls}"><label class="switch"><input type="checkbox" name="${f.name}"${v ? ' checked' : ''}><span></span>${esc(f.label)}</label></div>`;
    case 'image':

function drawPrev(name) {
  const el = $('#prev_' + name); if (!el) return;
  el.innerHTML = (formImages[name] || []).map((s, i) => `<div class="pv"><img src="${esc(s)}" alt="Selected image ${i + 1}"><button type="button" data-act="rmimg" data-name="${esc(name)}" data-i="${i}" aria-label="Remove image">${icon('x', 14)}</button></div>`).join('');

function compress(file, max = 1000, q = 0.78) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', q));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

  inp.value = '';
  if (!files.length) return;
  try {
    const urls = await Promise.all(files.map(f => f.type.startsWith('image/') ? compress(f) : new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(f); })));
    formImages[name] = multi ? [...(formImages[name] || []), ...urls] : [urls[0]];
    drawPrev(name);
    $('#formErr').textContent = '';
  } catch (err) { $('#formErr').textContent = 'That file could not be read as an image. Try a JPG or PNG.'; }
});

    const watchLink = (form.elements.videoUrl || {}).value || '';
    if (!watchLink.trim()) {
      err.textContent = 'The Watch link is required so every sermon card has a working button.';
      return;
    }
  }
  const data = {};
  const sendPush = key === 'announcements' ? !!(form.elements.sendPush ? form.elements.sendPush.checked : true) : false;
  for (const f of col.fields) {
    if (f.type === 'image' || f.type === 'file' || f.name === 'sendPush') continue;
    const el = form.elements[f.name];
    data[f.name] = f.type === 'checkbox' ? !!el.checked : (el ? (el.value || '').trim() : '');
  }
  if (!col.noPublish) data.published = form.elements.published.checked;
  const btn = $('button[type=submit]', form), label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    if (Store.mode === 'supabase') {
      btn.textContent = 'Uploading…';
      for (const f of imgFields) formImages[f.name] = await Promise.all((formImages[f.name] || []).map(x => x.startsWith('data:') ? Store.uploadImage(x) : x));
      btn.textContent = 'Saving…';
    }
    const now = new Date().toISOString(), saved = [];
    const multiF = !id && imgFields.find(f => f.multiple);
    if (multiF) {
      formImages[multiF.name].forEach(src => saved.push({ ...data, [multiF.name]: src, id: uid(), createdAt: now }));
    } else {
      const obj = { ...(item || {}), ...data, id: id || uid(), createdAt: (item && item.createdAt) || now, updatedAt: now };
      imgFields.forEach(f => { obj[f.name] = (formImages[f.name] || [])[0] || ''; });
      saved.push(obj);
    }
    for (const o of saved) {
      try {
        await Store.save(key, o);
      } catch (saveError) {
        if (!sessionExpired(saveError) || Store.mode !== 'supabase') throw saveError;
        await Store.sb.auth.refreshSession();
        await Store.save(key, o);
      }
    }
    if (key === 'announcements' && saved.some(o => o.published && !item?.published)) {
      try {
        const publishQueue = saved.filter(o => o.published && !item?.published);
        if (sendPush) {
          await Promise.all(publishQueue.map(o => Store.notifyAnnouncement(o.id)));
          toast(`${publishQueue.length} announcement${publishQueue.length === 1 ? '' : 's'} published and push sent`);
        } else {
          toast(`${publishQueue.length} announcement${publishQueue.length === 1 ? '' : 's'} published`);
        }
      }
      catch (notificationError) { toast('Announcement saved, but push delivery needs configuration.', 'bad'); }
    }
    if (item) imgFields.forEach(f => { if (item[f.name] && item[f.name] !== saved[0][f.name]) Store.removeFile(item[f.name]); });
    cache[key] = cache[key] || [];
    saved.forEach(o => { const i = cache[key].findIndex(x => x.id === o.id); if (i >= 0) cache[key][i] = o; else cache[key].push(o); });
    setBadge(key);
    $('#formDlg').close();
    toast(saved.length > 1 ? `${saved.length} photos saved` : `${col.singular[0].toUpperCase() + col.singular.slice(1)} saved`);
    if (route === key) drawList(key); else if (route === 'dashboard') viewDashboard($('#main'));
  } catch (ex) {
    if (sessionExpired(ex) || ex?.code === 'AUTH_EXPIRED') {
      Store.notice = 'Your admin session expired. Sign in again to continue saving.';
      $('#formDlg').close();
      if (Store.mode === 'supabase') await Store.sb.auth.signOut();
      showLogin();
      return;
    }
    err.textContent = blocked(ex) ? 'Saving was blocked. Sign in with the admin email you put in the SQL, then try again.' : ((ex && ex.message) || 'Could not save. Try again.');
    btn.disabled = false; btn.textContent = label;
  }
}

/* ============================================================
   delete / publish toggle / backup
   ============================================================ */
function askDelete(key, id) {
  const col = COLLECTIONS[key], it = cache[key].find(x => x.id === id); if (!it) return;
  pendingDelete = { key, id };
  $('#confT').textContent = `Delete this ${col.singular}?`;
  $('#confP').textContent = `"${titleOf(col, it)}" will be removed for good. This cannot be undone.`;
  $('#confErr').textContent = '';
  $('#confDlg').showModal();
}
$('#confYes').addEventListener('click', async () => {
  if (!pendingDelete) return;
  const { key, id } = pendingDelete, btn = $('#confYes');
  btn.disabled = true;
  try {
    const gone = cache[key].find(x => x.id === id);
    await Store.remove(key, id);
    if (gone) COLLECTIONS[key].fields.filter(f => f.type === 'image').forEach(f => Store.removeFile(gone[f.name]));
    cache[key] = cache[key].filter(x => x.id !== id);
    setBadge(key);
    $('#confDlg').close();
    pendingDelete = null;
    toast('Deleted');
    if (route === key) drawList(key);
  } catch (ex) { $('#confErr').textContent = blocked(ex) ? 'Deleting was blocked. Sign in with the admin email you put in the SQL, then try again.' : ((ex && ex.message) || 'Could not delete. Try again.'); }
  btn.disabled = false;
});
async function togglePub(key, id) {
  const it = cache[key].find(x => x.id === id); if (!it) return;
  const wasPublished = !!it.published;
  const upd = { ...it, published: !it.published, updatedAt: new Date().toISOString() };
  try {
    await Store.save(key, upd);
    if (key === 'announcements' && upd.published && !wasPublished) {
      try { await Store.notifyAnnouncement(upd.id); } catch (_) { toast('Published, but push delivery needs configuration.', 'bad'); }
    }
    Object.assign(it, upd); drawList(key); toast(upd.published ? 'Published' : 'Moved to drafts');
  }
  catch (ex) { toast(ex.message || 'Could not update.', 'bad'); }
}
async function exportAll() {
  const out = { exportedAt: new Date().toISOString(), church: 'Christian Service Church' };
  for (const k of KEYS) out[k] = await load(k, true);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
  a.download = 'csc-backup-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast('Backup downloaded');
}
async function copyText(id) {
  const txt = $('#' + id).textContent;
  try { await navigator.clipboard.writeText(txt); toast('Copied'); }
  catch (e) { const r = document.createRange(); r.selectNodeContents($('#' + id)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Press copy on your keyboard to finish', 'bad'); }
}

/* ============================================================
   click + input wiring
   ============================================================ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const d = t.dataset;
  switch (d.act) {
    case 'new': openForm(route); break;
    case 'edit': openForm(route, d.id); break;
    case 'del': askDelete(route, d.id); break;
    case 'toggle': togglePub(route, d.id); break;
    case 'chip': ui.f = d.v; drawList(route); break;
    case 'menu': toggleMenu(); break;
    case 'logout': logout(); break;
    case 'closeform': $('#formDlg').close(); break;
    case 'closeconf': $('#confDlg').close(); break;
    case 'rmimg': formImages[d.name].splice(+d.i, 1); drawPrev(d.name); break;
    case 'quicknew': pendingNew = d.k; location.hash = '#/' + d.k; break;
    case 'copy': copyText(d.t); break;
    case 'export': exportAll(); break;
    case 'reset':
      KEYS.forEach(k => lsDel(LS + k)); cache = {}; toast('Demo data reset'); go(); KEYS.forEach(k => load(k)); break;
  }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { ui.q = e.target.value; drawList(route); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleMenu(false); });

/* ============================================================
   start
   ============================================================ */
(async function boot() {
  try { await Store.init(); }
  catch (e) { Store.mode = 'demo'; Store.notice = 'Supabase could not be reached, so this is running in demo mode.'; }
  if (Store.mode === 'supabase') {
    const { data } = await Store.sb.auth.getSession();
    if (data && data.session) {
      try { await Store.ensureSession(); showApp(); }
      catch (_) { Store.notice = 'Your admin session expired. Sign in again to continue.'; await Store.sb.auth.signOut(); showLogin(); }
    } else showLogin();
    /* setTimeout keeps Supabase calls out of the auth callback, as its docs advise */
    Store.sb.auth.onAuthStateChange((event, session) => setTimeout(() => {
      if (session && $('#app').hidden) showApp();
      else if (!session && !$('#app').hidden) { cache = {}; showLogin(); }
    }, 0));
  } else if (demoAuthed) showApp();
  else showLogin();
})();
})();
</script>
